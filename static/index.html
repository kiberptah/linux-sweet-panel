<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinuxPanel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314151c'/%3E%3Cpath d='M9 11l5 5-5 5' stroke='%23b9a8ff' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M17 21h6' stroke='%2395e6c0' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/xterm/xterm.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="login-view" class="login-view hidden">
  <form id="login-form" class="login-card" autocomplete="on" novalidate>
    <div class="brand brand-lg"><span class="brand-mark">LP</span><span class="brand-name">LinuxPanel</span></div>
    <p class="login-sub">Sign in with your Linux account</p>
    <label class="field"><span>Username</span><input id="login-user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label class="field"><span>Password</span><input id="login-pass" name="password" type="password" autocomplete="current-password" required></label>
    <div id="login-error" class="login-error hidden" role="alert"></div>
    <button id="login-submit" class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>
</div>
<div id="app-view" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">LP</span><span class="brand-name">LinuxPanel</span></div>
    <nav class="nav" id="nav">
      <a class="nav-item" href="#/dashboard" data-route="dashboard"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v4h-7zM14 11h7v10h-7zM3 14h7v7H3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span>Dashboard</span></a>
      <a class="nav-item" href="#/workspace" data-route="workspace"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM7 9l3 3-3 3M12 15h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Workspace</span></a>
      <a class="nav-item admin-only" href="#/accounts" data-route="accounts"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11a3 3 0 100-6 3 3 0 000 6zM2 20c0-3 2.7-5 6-5s6 2 6 5M17 11a3 3 0 100-6M16 20c0-2 .5-3.5 1.5-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Accounts</span></a>
      <a class="nav-item admin-only" href="#/security" data-route="security"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span>Security</span></a>
      <a class="nav-item admin-only" href="#/settings" data-route="settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 100-6 3 3 0 000 6zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Settings</span></a>
    </nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="topbar-left"><span class="host" id="top-host">&mdash;</span></div>
      <div class="topbar-right"><span class="user-chip" id="top-user">&mdash;</span><button id="logout-btn" class="btn btn-ghost btn-sm" type="button">Log out</button></div>
    </header>
    <main id="content" class="content"></main>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<script src="vendor/xterm/xterm.js"></script>
<script src="vendor/xterm/addon-fit.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
